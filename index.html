<style>
  :root {
    --rosa-seco: #C99A93;
    --rosa-escuro: #A97068;
    --rosa-claro: #F6E9E6;
    --rosa-claro-2: #FBF3F1;
    --texto: #4A3936;
    --branco: #FFFFFF;
    --radius: 14px;
    box-sizing: border-box;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rosa-claro-2: #2A211F;
      --branco: #201917;
      --texto: #F1E4E1;
    }
  }

  :root[data-theme="dark"] {
    --rosa-claro-2: #2A211F;
    --branco: #201917;
    --texto: #F1E4E1;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    padding-top: env(safe-area-inset-top, 0px);
    overflow-x: hidden;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--branco);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }

  .cover {
    height: 100vh;
    min-height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rosa-claro);
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
  }

  .cover-logo {
    width: 260px;
    max-width: 62vw;
    will-change: transform, opacity;
  }

  header {
    background: var(--rosa-claro);
    padding: 28px 20px 20px;
    text-align: center;
    position: relative;
  }

  header .contact {
    position: absolute;
    top: calc(18px + env(safe-area-inset-top, 0px));
    right: 20px;
    font-size: 11px;
    color: var(--rosa-escuro);
    line-height: 1.5;
    text-align: right;
  }

  header img.logo {
    width: 190px;
    max-width: 60vw;
    display: block;
    margin: 8px auto 6px;
  }

  header .rule {
    width: 140px;
    height: 1px;
    background: var(--rosa-seco);
    margin: 4px auto 10px;
  }

  header .tagline {
    font-size: 13px;
    color: var(--texto);
    letter-spacing: 0.2px;
  }

  main { max-width: 900px; margin: 0 auto; padding: 22px 18px 60px; }

  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    background: var(--branco);
    border-bottom: 1px solid var(--rosa-seco);
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }

  .tab-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--rosa-escuro);
    background: var(--rosa-claro-2);
    border: 1px solid var(--rosa-seco);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab-btn.active {
    background: var(--rosa-seco);
    color: var(--branco);
  }

  .section-heading {
    text-align: center;
    margin: 40px 0 18px;
    padding-top: 8px;
    border-top: 1px solid var(--rosa-seco);
  }

  .section-heading h2 {
    font-size: 20px;
    margin: 14px 0 4px;
    color: var(--rosa-escuro);
  }

  .section-heading p {
    font-size: 13px;
    margin: 0;
    color: var(--texto);
  }

  #sec-dia, #sec-festas, #sec-paes, #sec-fit, #sec-frangos {
    scroll-margin-top: calc(56px + env(safe-area-inset-top, 0px));
  }

  .intro {
    background: var(--rosa-claro-2);
    border: 1px solid var(--rosa-seco);
    border-radius: var(--radius);
    padding: 20px 20px 4px;
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px 32px;
  }

  @media (min-width: 620px) {
    .intro { grid-template-columns: 1.3fr 1fr; }
  }

  .intro-block h2 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--rosa-escuro);
    margin: 0 0 10px;
  }

  .intro-block p {
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 12px;
  }

  .intro-block ul {
    margin: 0 0 12px;
    padding-left: 18px;
    font-size: 13.5px;
    line-height: 1.6;
  }

  .intro-block li { margin-bottom: 2px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 620px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    border: 1px solid var(--rosa-seco);
    border-radius: var(--radius);
    padding: 10px;
    background: var(--branco);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(169, 112, 104, 0.18);
    outline: none;
  }

  .card .thumb {
    background: var(--rosa-claro);
    border: 1px solid var(--rosa-seco);
    border-radius: 8px;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card .thumb svg { width: 34%; opacity: 0.55; }

  .card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
  }

  .card .name {
    font-weight: 700;
    font-size: 13.5px;
    line-height: 1.25;
  }

  .card .price {
    color: var(--rosa-escuro);
    font-weight: 700;
    font-size: 13px;
  }

  .card-subtitle {
    font-size: 11px;
    color: var(--texto);
    opacity: 0.75;
    line-height: 1.35;
  }

  .detail {
    position: fixed;
    inset: 0;
    background: var(--branco);
    overflow-y: auto;
    padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 10;
    overscroll-behavior: contain;
  }

  .detail.open { transform: translateX(0); }

  .detail-header {
    background: var(--rosa-claro);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 16px;
    position: sticky;
    top: 0;
    z-index: 11;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--rosa-escuro);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
    font-family: inherit;
    -webkit-touch-callout: none;
  }

  .back-btn svg { width: 16px; height: 16px; }

  .detail-body {
    padding: 18px;
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }

  .photo-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  @media (max-width: 480px) {
    .photo-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
  }

  .photo-slot {
    background: var(--rosa-claro);
    border: 1px solid var(--rosa-seco);
    border-radius: 10px;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .photo-slot svg { width: 30%; opacity: 0.55; }
  .photo-slot.has-photo { padding: 0; overflow: hidden; }

  .photo-slot.has-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-slot span {
    font-size: 9.5px;
    font-style: italic;
    color: var(--rosa-seco);
  }

  .detail-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .detail-title-row h1 {
    font-size: 21px;
    margin: 0;
    line-height: 1.25;
    flex: 1 1 100%;
  }

  .detail-title-row .price {
    color: var(--rosa-escuro);
    font-weight: 700;
    font-size: 18px;
    white-space: nowrap;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--rosa-escuro);
    background: var(--rosa-claro-2);
    border: 1px solid var(--rosa-seco);
    border-radius: 999px;
    padding: 4px 10px;
    margin: 10px 0 18px;
  }

  section.block { margin-bottom: 22px; }

  section.block h2 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--rosa-escuro);
    margin: 0 0 8px;
  }

  section.block p, section.block ul {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.6;
  }

  section.block ul { padding-left: 18px; }

  .placeholder-text {
    color: var(--rosa-seco);
    font-style: italic;
  }

  .flavor-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .flavor-chip {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--rosa-escuro);
    background: var(--rosa-claro-2);
    border: 1px solid var(--rosa-seco);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-touch-callout: none;
  }

  .flavor-chip.active {
    background: var(--rosa-seco);
    color: var(--branco);
  }

  footer.page-footer {
    text-align: center;
    font-size: 11px;
    color: var(--rosa-seco);
    padding: 30px 0 10px;
  }

  @media (max-width: 480px) {
    .grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .tabs {
      gap: 6px;
      padding: 8px 10px;
    }

    .tab-btn {
      flex: 1 1 calc(50% - 8px);
      min-width: 120px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .section-heading h2 {
      font-size: 18px;
    }

    .detail-title-row {
      flex-direction: column;
      align-items: flex-start;
    }

    .photo-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .detail-body {
      padding: 14px;
    }

    main {
      padding: 16px 14px 60px;
    }

    header .contact {
      top: 12px;
      right: 12px;
      font-size: 10px;
    }
  }
</style>
